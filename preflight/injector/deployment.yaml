apiVersion: v1
kind: ServiceAccount
metadata:
  name: preflight-injector
  namespace: nvsentinel
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preflight-injector
  namespace: nvsentinel
  labels:
    app.kubernetes.io/name: preflight-injector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: preflight-injector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: preflight-injector
    spec:
      serviceAccountName: preflight-injector
      # Workaround for kind cluster networking issues: ensure the webhook runs on the
      # control-plane node so the API server can always reach it.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: webhook
          image: docker.io/xrfxlp/preflight-injector:latest
          imagePullPolicy: Always
          args:
            - --port=8443
            - --cert-dir=/certs
            - --cert-name=tls.crt
            - --key-name=tls.key
          env:
            # Preflight checker image to inject
            - name: PREFLIGHT_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: preflight-injector-config
                  key: preflight-checker-image
                  optional: true
            # DCGM hostengine address
            - name: DCGM_HOSTENGINE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: preflight-injector-config
                  key: dcgm-hostengine-addr
                  optional: true
            # DCGM diagnostic level
            - name: DCGM_DIAG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: preflight-injector-config
                  key: dcgm-diag-level
                  optional: true
            # Platform Connector socket path
            - name: PLATFORM_CONNECTOR_SOCKET
              valueFrom:
                configMapKeyRef:
                  name: preflight-injector-config
                  key: platform-connector-socket
                  optional: true
            # GPU resource names to detect
            - name: GPU_RESOURCE_NAMES
              valueFrom:
                configMapKeyRef:
                  name: preflight-injector-config
                  key: gpu-resource-names
                  optional: true
            - name: NCCL_BW_THRESHOLD
              value: "1"
          ports:
            - name: https
              containerPort: 8443
          volumeMounts:
            - name: tls-certs
              mountPath: /certs
              readOnly: true
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: 8443
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: 8443
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: tls-certs
          secret:
            # Must contain keys: tls.crt and tls.key (type kubernetes.io/tls)
            secretName: preflight-webhook-cert
---
apiVersion: v1
kind: Service
metadata:
  name: preflight-injector
  namespace: nvsentinel
  labels:
    app.kubernetes.io/name: preflight-injector
spec:
  selector:
    app.kubernetes.io/name: preflight-injector
  ports:
    # API server calls the webhook service at port 443 (per mutatingWebhook.yaml).
    - name: https
      port: 443
      targetPort: 8443
