[tool.poetry]
name = "dcgm-diag"
version = "0.1.0"
description = "DCGM preflight diagnostic check"
authors = ["NVIDIA"]

[tool.poetry.dependencies]
python = "^3.10"
click = "^8.1.0"
grpcio = "^1.74.0"
grpcio-tools = "^1.75.0"
protobuf = ">=6.31.1,<7.0.0"
pynvml = "^12.0.0"

[tool.poetry.group.dev.dependencies]
black = "^26.1.0"
pytest = "^9.0.0"
ruff = "^0.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
dcgm-diag = "dcgm_diag.__main__:main"

[tool.black]
line-length = 120
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.venv
    | _build
    | dist
  )/
  | dcgm_diag/protos
)
'''

[tool.ruff]
line-length = 120
exclude = ["dcgm_diag/protos"]

