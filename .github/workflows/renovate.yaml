# Self-hosted Renovate. It updates the tool versions in .versions.yaml, which
# Dependabot cannot read. Configuration: .github/renovate.json5.

name: Renovate

on:
  schedule:
    - cron: "0 5 * * 1"  # Mondays 05:00 UTC
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Run in dry-run mode (no branches or PRs)"
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # Renovate writes a status check on each branch; without this the run aborts.
      statuses: write
      # Renovate reads Dependabot alerts to flag security updates in PRs.
      security-events: read
    steps:
      - name: Configure dry-run mode
        if: ${{ inputs.dryRun }}
        run: echo "RENOVATE_DRY_RUN=full" >> "$GITHUB_ENV"

      - name: Run Renovate
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9  # v46.3.8
        with:
          renovate-version: '43@sha256:00185c0d63462acec8331cc9a94dcd74a763f2765fca0edcc3ff568af1dc8104'
        env:
          RENOVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
          RENOVATE_ONBOARDING: "false"
          RENOVATE_GIT_AUTHOR: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          LOG_LEVEL: info
