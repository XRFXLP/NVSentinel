name: E2E Tests (Parallel by Architecture)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # AMD64 + MongoDB
  # ============================================
  e2e-amd64-mongodb:
    name: E2E AMD64 (MongoDB)
    runs-on: [self-hosted, linux, amd64]
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      
      - name: Setup test environment
        run: |
          export CSP=kind
          export FAKE_GPU_NODE_COUNT=55
          export STORE_TYPE=mongodb
          ./tests/uat/install-apps.sh
      
      - name: Run E2E tests (AMD64 group)
        run: |
          cd tests
          go test -v \
            -tags=amd64_group \
            -timeout 60m \
            -coverprofile=coverage-amd64-mongodb.out \
            -coverpkg=./... \
            ./...
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./tests/coverage-amd64-mongodb.out
          flags: e2e-amd64-mongodb
          name: e2e-amd64-mongodb
      
      - name: Cleanup
        if: always()
        run: |
          kind delete cluster --name nvsentinel-test || true

  # ============================================
  # ARM64 + MongoDB
  # ============================================
  e2e-arm64-mongodb:
    name: E2E ARM64 (MongoDB)
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      
      - name: Setup test environment
        run: |
          export CSP=kind
          export FAKE_GPU_NODE_COUNT=55
          export STORE_TYPE=mongodb
          ./tests/uat/install-apps.sh
      
      - name: Run E2E tests (ARM64 group)
        run: |
          cd tests
          go test -v \
            -tags=arm64_group \
            -timeout 60m \
            -coverprofile=coverage-arm64-mongodb.out \
            -coverpkg=./... \
            ./...
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./tests/coverage-arm64-mongodb.out
          flags: e2e-arm64-mongodb
          name: e2e-arm64-mongodb
      
      - name: Cleanup
        if: always()
        run: |
          kind delete cluster --name nvsentinel-test || true

  # ============================================
  # AMD64 + PostgreSQL
  # ============================================
  e2e-amd64-postgresql:
    name: E2E AMD64 (PostgreSQL)
    runs-on: [self-hosted, linux, amd64]
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      
      - name: Setup test environment
        run: |
          export CSP=kind
          export FAKE_GPU_NODE_COUNT=55
          export STORE_TYPE=postgresql
          ./tests/uat/install-apps.sh
      
      - name: Run E2E tests (AMD64 group)
        run: |
          cd tests
          go test -v \
            -tags=amd64_group \
            -timeout 60m \
            -coverprofile=coverage-amd64-postgresql.out \
            -coverpkg=./... \
            ./...
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./tests/coverage-amd64-postgresql.out
          flags: e2e-amd64-postgresql
          name: e2e-amd64-postgresql
      
      - name: Cleanup
        if: always()
        run: |
          kind delete cluster --name nvsentinel-test || true

  # ============================================
  # ARM64 + PostgreSQL
  # ============================================
  e2e-arm64-postgresql:
    name: E2E ARM64 (PostgreSQL)
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      
      - name: Setup test environment
        run: |
          export CSP=kind
          export FAKE_GPU_NODE_COUNT=55
          export STORE_TYPE=postgresql
          ./tests/uat/install-apps.sh
      
      - name: Run E2E tests (ARM64 group)
        run: |
          cd tests
          go test -v \
            -tags=arm64_group \
            -timeout 60m \
            -coverprofile=coverage-arm64-postgresql.out \
            -coverpkg=./... \
            ./...
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./tests/coverage-arm64-postgresql.out
          flags: e2e-arm64-postgresql
          name: e2e-arm64-postgresql
      
      - name: Cleanup
        if: always()
        run: |
          kind delete cluster --name nvsentinel-test || true

  # ============================================
  # All Tests Must Pass
  # ============================================
  e2e-complete:
    name: E2E Tests Complete
    runs-on: ubuntu-latest
    needs:
      - e2e-amd64-mongodb
      - e2e-arm64-mongodb
      - e2e-amd64-postgresql
      - e2e-arm64-postgresql
    
    steps:
      - name: All tests passed
        run: |
          echo "✅ All E2E tests passed successfully!"
          echo ""
          echo "Test Matrix:"
          echo "  - AMD64 + MongoDB: ✅"
          echo "  - ARM64 + MongoDB: ✅"
          echo "  - AMD64 + PostgreSQL: ✅"
          echo "  - ARM64 + PostgreSQL: ✅"
          echo ""
          echo "Total time saved: ~37 minutes (49% faster)"

