name: Integration Tests - GCP

on:
  workflow_dispatch: {}  # allow manual runs for testing
  schedule:
    - cron: '30 14 * * *' # daily at 14:30 UTC, runs on default branch only
  push:
    branches:
      - main
      # TEMP (#2013): test the GPU reset against a host-installed GKE driver. Revert after the test.
      - "pull-request/2013"

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  # TEMP (#2013): publish the janitor and gpu-reset images from the PR branch under a fixed test
  # tag that tests/uat/gcp/nvsentinel-values.yaml points at. Revert after the test.
  build-pr-images:
    if: github.repository == 'nvidia/nvsentinel' && github.ref == 'refs/heads/pull-request/2013'
    runs-on: linux-amd64-cpu32
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      PR_IMAGE_TAG: "pull-request-2013-test"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup build environment
        uses: ./.github/actions/setup-ci-env

      - name: Authenticate to GHCR
        shell: bash
        run: echo ${{ secrets.GITHUB_TOKEN }} | ko login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publish janitor image
        shell: bash
        env:
          KO_DOCKER_REPO: ghcr.io/nvidia/nvsentinel
          VERSION: ${{ env.PR_IMAGE_TAG }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          BUILD_DATE=$(date -u +%FT%TZ)
          export BUILD_DATE
          ko build -B --sbom=none --platform=linux/amd64 --tags="${VERSION}" ./janitor

      # Publish without the shared publish-container action: it signs and attests the image,
      # which a throwaway test tag does not need.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef  # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish gpu-reset image
        shell: bash
        env:
          CI_COMMIT_REF_NAME: ${{ env.PR_IMAGE_TAG }}
          DISABLE_REGISTRY_CACHE: 'true'
        run: make -C gpu-reset docker-publish

  integration-test-gcp:
    # TEMP (#2013): wait for build-pr-images, which is skipped on every other ref. Restore
    # `if: github.repository == 'nvidia/nvsentinel'` and drop `needs` after the test.
    needs: [build-pr-images]
    if: github.repository == 'nvidia/nvsentinel' && !failure() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CSP: "gcp"
      PREFIX: "nvs"
      PROJECT_ID: "nv-dgxck8s-20250306"
      IDENTITY_PROVIDER: "projects/1015254933832/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
      SERVICE_ACCOUNT: "github-actions-user"
      # Terraform Vars
      TF_VAR_deployment_id: "d${{ github.run_id }}"
      TF_VAR_project_id: "nv-dgxck8s-20250306"
      TF_VAR_region: "europe-west4"
      TF_VAR_zone: "europe-west4-b"
      TF_VAR_system_node_type: "e2-standard-4"
      TF_VAR_system_node_count: "3"
      TF_VAR_gpu_node_pool_name: "gpu-pool"
      TF_VAR_gpu_machine_type: "a3-megagpu-8g"
      TF_VAR_gpu_node_count: "1"
      TF_VAR_gpu_reservation_project: "nv-dgxcloudprodgsc-20240206"
      TF_VAR_gpu_reservation_name: "gsc-a3-megagpu-8g-shared-res-2"
      TF_VAR_gpu_driver_version: "INSTALLATION_DISABLED"
      TF_VAR_resource_labels: '{"environment":"test","team":"nvsentinel","managed_by":"terraform"}'
      # Debug
      SKIP_DELETE: "false"  # skip cluster deletion
      # TEMP (#2013): images from the main commit that pull-request/2013 is based on.
      TEST_TAG: "main-25b77d3"
      
    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Terraform
      - name: Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "1.13.5"

      # Auth
      - name: Get AuthN Token
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.IDENTITY_PROVIDER }}
          service_account: "${{ env.SERVICE_ACCOUNT }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

      # Gcloud
      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1

      # Cluster
      - name: Create Cluster
        id: cluster
        shell: bash
        continue-on-error: true 
        run: |
          set -euo pipefail
          cd tests/uat/gcp/cluster
          terraform init
          terraform apply -auto-approve

      # Connect
      - name: Connect to Cluster
        id: client
        if: steps.cluster.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "Installing GKE auth plugin..."
          gcloud components install gke-gcloud-auth-plugin --quiet --project ${{ env.TF_VAR_project_id }}
          echo "Getting cluster credentials..."
          gcloud container clusters get-credentials "${{ env.PREFIX }}-${{ env.TF_VAR_deployment_id }}" \
            --zone ${{ env.TF_VAR_zone }} --project ${{ env.TF_VAR_project_id }}

      # Image Tag
      - name: Compute ref name with short SHA
        id: ref-name
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            SAFE_REF="${{ github.ref_name }}"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            SAFE_REF="${{ github.ref_name }}-${SHORT_SHA}"
          else
            SAFE_REF="${{ env.TEST_TAG }}"
          fi
          # Sanitize ref name: replace slashes with hyphens for Docker tag compatibility
          SAFE_REF=$(echo "$SAFE_REF" | sed 's/\//-/g')
          echo "value=$SAFE_REF" >> $GITHUB_OUTPUT

      # Apps
      - name: Install NVS
        id: apps
        if: steps.client.outcome == 'success'
        shell: bash
        env:
          GCP_PROJECT_ID: "${{ env.PROJECT_ID }}"
          GCP_ZONE: "${{ env.TF_VAR_zone }}"
          GCP_SERVICE_ACCOUNT: "${{ env.SERVICE_ACCOUNT }}"
          NVSENTINEL_VERSION: "${{ steps.ref-name.outputs.value }}"
        run: |
          set -euxo pipefail
          tests/uat/install-apps.sh

      # Test
      - name: Run UAT Tests
        id: tests
        if: steps.apps.outcome == 'success'
        shell: bash
        run: |
          set -euxo pipefail
          tests/uat/tests.sh

      # Teardown
      - name: Destroy Cluster
        if: always() && steps.cluster.outcome != 'skipped' && env.SKIP_DELETE != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          cd tests/uat/gcp/cluster
          terraform destroy -auto-approve

      # Summary
      - name: Test Summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Cluster: ${{ steps.cluster.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Connection: ${{ steps.client.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Apps: ${{ steps.apps.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ steps.tests.outcome }}" >> $GITHUB_STEP_SUMMARY
