# Fabric overlay: GCP TCPXO/FastRak (A3+, A4 — multi-NIC Ethernet with aperture devices)
# Usage: helm upgrade preflight . -f values.yaml -f values-tcpxo.yaml
#
# Requirements:
#   - IPC_LOCK capability (set in base values.yaml)
#   - runtimeClassName: nvidia on the pod (GKE handles this)
#   - GKE's tcpxo-daemon init container (auto-injected by GKE webhook)
#   - networking.gke.io.networks/gpu-nicX resources (set in base values.yaml)
#
# Notes:
#   - The GCP guest config checker (shim) validates env vars against
#     a3plus_guest_config.textproto. It exits on the first enforced mismatch.
#   - Categories: "user must populate", "enforced", "recommended unset"
#   - DO NOT set: NCCL_IB_DISABLE, NCCL_COLLNET_ENABLE, NCCL_ALGO (except as below)
#   - The shim/tuner plugin manages most transport settings automatically.

ncclAllreduceExtraEnv:
  - name: BW_THRESHOLD_GBPS
    value: "200"
  # TCPXO multi-NIC socket pinning
  - name: NCCL_SOCKET_IFNAME
    value: "eth1,eth2,eth3,eth4,eth5,eth6,eth7,eth8"
  - name: NCCL_CROSS_NIC
    value: "0"
  - name: NCCL_NVLS_ENABLE
    value: "0"
  # Required by GCP guest config checker (user must populate):
  - name: NCCL_FASTRAK_CTRL_DEV
    value: "eth0"
  - name: NCCL_FASTRAK_IFNAME
    value: "eth1,eth2,eth3,eth4,eth5,eth6,eth7,eth8"
  # Enforced by GCP guest config checker (exact values):
  - name: NCCL_BUFFSIZE
    value: "8388608"
  - name: NCCL_FASTRAK_NUM_FLOWS
    value: "2"
  - name: NCCL_FASTRAK_USE_SNAP
    value: "1"
  - name: NCCL_FASTRAK_USE_LLCM
    value: "1"
  - name: NCCL_FASTRAK_LLCM_DEVICE_DIRECTORY
    value: "/dev/aperture_devices"
  - name: NCCL_FASTRAK_ENABLE_CONTROL_CHANNEL
    value: "0"
  - name: NCCL_FASTRAK_ENABLE_HOTPATH_LOGGING
    value: "0"
  - name: NCCL_FASTRAK_PLUGIN_ACCEPT_TIMEOUT_MS
    value: "600000"
  - name: NCCL_NET_GDR_LEVEL
    value: "PIX"
  # Shim/tuner plugin config
  - name: NCCL_SHIMNET_GUEST_CONFIG_CHECKER_CONFIG_FILE
    value: "/usr/local/nvidia/lib64/a3plus_guest_config.textproto"
  - name: NCCL_TUNER_PLUGIN
    value: "libnccl-tuner.so"
  - name: NCCL_TUNER_CONFIG_PATH
    value: "/usr/local/nvidia/lib64/a3plus_tuner_config.textproto"
  - name: LD_LIBRARY_PATH
    value: "/usr/local/nvidia/lib64:/usr/lib/x86_64-linux-gnu"
  # Additional enforced values (discovered via guest config checker fail-fast):
  - name: NCCL_PROTO
    value: "Simple"
  - name: NCCL_P2P_NVL_CHUNKSIZE
    value: "1048576"
  - name: NCCL_ALGO
    value: "Ring,Tree"
  - name: NCCL_MIN_NCHANNELS
    value: "4"
  - name: NCCL_DYNAMIC_CHUNK_SIZE
    value: "524288"
  - name: NCCL_P2P_NET_CHUNKSIZE
    value: "524288"
  - name: NCCL_P2P_PCI_CHUNKSIZE
    value: "524288"

gangCoordination:
  # Mount TCPXO volumes injected by GKE's tcpxo-daemon webhook.
  # These volumes already exist in the pod; we add volumeMounts to init containers.
  extraVolumeMounts:
    - name: nvtcpxo-libraries
      mountPath: /usr/local/nvidia
      readOnly: true
    - name: nvtcpxo-aperture-devices
      mountPath: /dev/aperture_devices
