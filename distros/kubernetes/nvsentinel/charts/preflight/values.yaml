# =============================================================================
# Global Configuration
# =============================================================================
# These values are typically set in the parent chart (nvsentinel/values.yaml)
# but can be overridden here for standalone deployment
global:
  dcgm:
    service:
      # DCGM hostengine service endpoint (GPU Operator's DCGM service)
      endpoint: "nvidia-dcgm.gpu-operator.svc"
      port: 5555

replicaCount: 1

image:
  repository: ghcr.io/nvidia/nvsentinel/preflight
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 443
  targetPort: 8443

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1024Mi

livenessProbe:
  httpGet:
    scheme: HTTPS
    path: /healthz
    port: 8443
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    scheme: HTTPS
    path: /healthz
    port: 8443
  initialDelaySeconds: 2
  periodSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}

webhook:
  port: 8443
  failurePolicy: Fail
  timeoutSeconds: 10
  # Set to true to create the two-tier CA
  # Set to false to use an existing CA issuer
  createIssuer: true
  # Only used when createIssuer=false
  certIssuer: ""
  caCertificateName: ""

# =============================================================================
# DCGM Configuration
# =============================================================================
# Local fallback values - global.dcgm takes precedence when set
dcgm:
  service:
    # DCGM hostengine service endpoint (fallback when global.dcgm.service not set)
    endpoint: "nvidia-dcgm.gpu-operator.svc"
    port: 5555
  # Diagnostic level:
  #   1 = Quick (~30 seconds) - basic health check
  #   2 = Medium (~2 minutes) - more thorough
  #   3 = Long (~15 minutes) - comprehensive
  diagLevel: 2
  # Event processing strategy: EXECUTE_REMEDIATION or STORE_ONLY
  processingStrategy: "EXECUTE_REMEDIATION"

# =============================================================================
# Init Containers to inject into GPU pods
# =============================================================================
# These containers run as init containers before the main workload starts.
# The webhook injects GPU/network resources from the pod into these containers.
initContainers:
  - name: preflight-dcgm-diag
    image: ghcr.io/nvidia/nvsentinel/preflight-dcgm-diag:latest
    volumeMounts:
      - name: nvsentinel-socket
        mountPath: /var/run
    # Full corev1.Container fields supported:
    # resources:
    #   limits:
    #     memory: 512Mi

# =============================================================================
# GPU Resource Detection
# =============================================================================
# Resource names that trigger preflight injection
gpuResourceNames:
  - "nvidia.com/gpu"

# =============================================================================
# Network Resource Detection
# =============================================================================
# Network resource names to copy to init containers (RDMA, InfiniBand, etc.)
networkResourceNames:
  - "nvidia.com/mlnxnics"

# =============================================================================
# Namespace Selector
# =============================================================================
# Label-based namespace selection
# Enable preflight in a namespace: kubectl label namespace <name> nvsentinel.nvidia.com/preflight=enabled
namespaceSelector:
  matchLabels:
    nvsentinel.nvidia.com/preflight: "enabled"

# =============================================================================
# Network Policy
# =============================================================================
networkPolicy:
  enabled: true
