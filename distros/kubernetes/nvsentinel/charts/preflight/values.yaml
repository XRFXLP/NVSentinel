replicaCount: 1

image:
  repository: ghcr.io/nvidia/nvsentinel/preflight
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 443
  targetPort: 8443

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1024Mi

livenessProbe:
  httpGet:
    scheme: HTTPS
    path: /healthz
    port: 8443
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    scheme: HTTPS
    path: /healthz
    port: 8443
  initialDelaySeconds: 2
  periodSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}

webhook:
  port: 8443
  failurePolicy: Fail
  timeoutSeconds: 10
  # Set to true to create the two-tier CA
  # Set to false to use an existing CA issuer
  createIssuer: true
  # Only used when createIssuer=false
  certIssuer: ""
  caCertificateName: ""

# Local fallback values - global.dcgm takes precedence when set
dcgm:
  service:
    # DCGM hostengine service endpoint (fallback when global.dcgm.service not set)
    endpoint: "nvidia-dcgm.gpu-operator.svc"
    port: 5555
  # Diagnostic level:
  #   1 = Quick (~30 seconds) - basic health check
  #   2 = Medium (~2 minutes) - more thorough
  #   3 = Long (~15 minutes) - comprehensive
  diagLevel: 2
  # Event processing strategy: EXECUTE_REMEDIATION or STORE_ONLY
  processingStrategy: "EXECUTE_REMEDIATION"

initContainers:
  - name: preflight-dcgm-diag
    image: ghcr.io/nvidia/nvsentinel/preflight-dcgm-diag:latest
    volumeMounts:
      - name: nvsentinel-socket
        mountPath: /var/run
    # Full corev1.Container fields supported:
    # resources:
    #   limits:
    #     memory: 512Mi

  # # NCCL loopback test - validates intra-node GPU-to-GPU communication (NVLink/PCIe)
  - name: preflight-nccl-loopback
    image: ghcr.io/nvidia/nvsentinel/preflight-nccl-loopback:latest
    env:
      - name: BW_THRESHOLD_GBPS
      # Minimum acceptable bus bandwidth
      # Valid for NVLink GPU-to-GPU interconnect
      # If using PCIe GPU-interconnect, this threshold should be set to ~15 GB/s
        value: "150"  # Minimum acceptable bus bandwidth in GB/s
      - name: TEST_SIZE_MB
        value: "256"  # Message size for all-reduce test
      # To skip the bandwidth check, set SKIP_BANDWIDTH_CHECK to true
      # By default, the bandwidth check is enabled
      # Checks if the loopback test passes without checking the bandwidth
      # - name: SKIP_BANDWIDTH_CHECK
      #   value: "true" 
    volumeMounts:
      - name: nvsentinel-socket
        mountPath: /var/run

  # NCCL all-reduce test - validates multi-node GPU communication
  # Requires gangCoordination.enabled=true and gang-aware scheduler (Volcano, Kueue, etc.)
  # Fabric-specific NCCL env vars are set via ncclAllreduceExtraEnv below, NOT by
  # overriding this container.  Use overlay files to set them:
  #   helm upgrade preflight . -f values.yaml -f values-<fabric>.yaml
  # See values-ib.yaml, values-efa.yaml, values-mnnvl-efa.yaml, values-tcpxo.yaml
  - name: preflight-nccl-allreduce
    image: ghcr.io/nvidia/nvsentinel/preflight-nccl-allreduce:latest
    securityContext:
      capabilities:
        add: ["IPC_LOCK"]  # Required for RDMA memory registration
    env:
      # Benchmark configuration (fabric-agnostic defaults)
      - name: BW_THRESHOLD_GBPS
        value: "100"  # Minimum acceptable bus bandwidth in GB/s
      - name: MESSAGE_SIZES
        value: "4G"  # Message size for bandwidth test
      - name: GANG_TIMEOUT_SECONDS
        value: "600"  # Timeout waiting for gang formation
      - name: NCCL_DEBUG
        value: "INFO"  # Set to WARN after transport selection is validated
      - name: NCCL_DEBUG_SUBSYS
        value: "INIT,NET"
    volumeMounts:
      - name: nvsentinel-socket
        mountPath: /var/run

# Interconnect fabric for NCCL all-reduce.
# Determines which NCCL environment variables, hostPath mounts, and volume
# mounts are injected into the preflight-nccl-allreduce init container.
# Supported values:
#   ""           - No fabric-specific config (manual via ncclAllreduceExtraEnv)
#   "ib"         - InfiniBand (Azure NDv4/v5)
#   "efa"        - AWS EFA (H100 p5)
#   "mnnvl-efa"  - MNNVL + EFA (GB200, GB300)
#   "tcpxo"      - GCP TCPXO/FastRak (A3+, A4)
networkFabric: ""

# Additional fabric-specific environment variables appended to the
# preflight-nccl-allreduce init container AFTER the networkFabric defaults.
# Use this to override or extend the fabric profile.
ncclAllreduceExtraEnv: []

# Per-fabric mount profiles. Keyed by networkFabric name.
# The selected profile's extraHostPathMounts and extraVolumeMounts are
# merged into gangCoordination at render time (see _helpers.tpl).
fabricProfiles:
  ib:
    env:
      - name: NCCL_TOPO_FILE
        value: "/etc/nccl/topo.xml"
      - name: NCCL_IB_PCI_RELAXED_ORDERING
        value: "1"
      - name: NCCL_SOCKET_IFNAME
        value: "eth0"
    extraHostPathMounts: []
    extraVolumeMounts: []
  efa:
    env:
      - name: FI_EFA_USE_DEVICE_RDMA
        value: "1"
      - name: FI_PROVIDER
        value: "efa"
      - name: NCCL_SOCKET_IFNAME
        value: "eth0"
      # Container's stale EFA/RDMA libs are removed at build time (Dockerfile).
      # At runtime, host's /opt/amazon provides libfabric + ofi-nccl.
      # Host's libefa.so.1 (needed by libfabric via dlopen) is bind-mounted
      # into the container at its standard path. Since the container's copy
      # was removed at build time, only the host version exists.
      - name: LD_LIBRARY_PATH
        value: "/opt/amazon/ofi-nccl/lib:/opt/amazon/efa/lib:/usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64"
    extraHostPathMounts:
      - name: host-opt-amazon
        hostPath: /opt/amazon
        mountPath: /opt/amazon
        readOnly: true
        hostPathType: Directory
      # Bind-mount individual host RDMA libs into the container's system lib
      # path. We cannot mount the entire /usr/lib/x86_64-linux-gnu directory
      # because it contains glibc (libc.so.6, libm.so.6) whose version may
      # differ from the container's — mounting it would break Python/CUDA.
      # The Dockerfile removes the container's stale copies of these files,
      # so the bind-mounts fill the gap with host-compatible versions.
      - name: host-libefa
        hostPath: /usr/lib/x86_64-linux-gnu/libefa.so.1
        mountPath: /usr/lib/x86_64-linux-gnu/libefa.so.1
        readOnly: true
        hostPathType: File
      - name: host-libibverbs
        hostPath: /usr/lib/x86_64-linux-gnu/libibverbs.so.1
        mountPath: /usr/lib/x86_64-linux-gnu/libibverbs.so.1
        readOnly: true
        hostPathType: File
      - name: host-libibverbs-dir
        hostPath: /usr/lib/x86_64-linux-gnu/libibverbs
        mountPath: /usr/lib/x86_64-linux-gnu/libibverbs
        readOnly: true
        hostPathType: Directory
    extraVolumeMounts: []
  mnnvl-efa:
    env:
      - name: FI_EFA_USE_DEVICE_RDMA
        value: "1"
      - name: NCCL_MNNVL_ENABLE
        value: "1"
      - name: NCCL_NVLS_ENABLE
        value: "0"
      - name: NCCL_NET_GDR_LEVEL
        value: "PHB"
      - name: NCCL_P2P_NET_CHUNKSIZE
        value: "2097152"
      - name: LD_LIBRARY_PATH
        value: "/opt/amazon-efa-ofi/ofi/lib:/opt/amazon-efa-ofi/efa/lib:/usr/local/nvidia/lib64:/usr/lib:/usr/lib64:/usr/local/cuda/lib64"
    extraHostPathMounts:
      - name: amazon-efa
        hostPath: /opt/amazon-efa-ofi
        mountPath: /opt/amazon-efa-ofi
        readOnly: true
        hostPathType: Directory
    extraVolumeMounts: []
  tcpxo:
    env:
      - name: NCCL_SOCKET_IFNAME
        value: "eth1,eth2,eth3,eth4,eth5,eth6,eth7,eth8"
      - name: NCCL_CROSS_NIC
        value: "0"
      - name: NCCL_NVLS_ENABLE
        value: "0"
      - name: NCCL_FASTRAK_CTRL_DEV
        value: "eth0"
      - name: NCCL_FASTRAK_IFNAME
        value: "eth1,eth2,eth3,eth4,eth5,eth6,eth7,eth8"
      - name: NCCL_BUFFSIZE
        value: "8388608"
      - name: NCCL_FASTRAK_NUM_FLOWS
        value: "2"
      - name: NCCL_FASTRAK_USE_SNAP
        value: "1"
      - name: NCCL_FASTRAK_USE_LLCM
        value: "1"
      - name: NCCL_FASTRAK_LLCM_DEVICE_DIRECTORY
        value: "/dev/aperture_devices"
      - name: NCCL_FASTRAK_ENABLE_CONTROL_CHANNEL
        value: "0"
      - name: NCCL_FASTRAK_ENABLE_HOTPATH_LOGGING
        value: "0"
      - name: NCCL_FASTRAK_PLUGIN_ACCEPT_TIMEOUT_MS
        value: "600000"
      - name: NCCL_NET_GDR_LEVEL
        value: "PIX"
      - name: NCCL_SHIMNET_GUEST_CONFIG_CHECKER_CONFIG_FILE
        value: "/usr/local/nvidia/lib64/a3plus_guest_config.textproto"
      - name: NCCL_TUNER_PLUGIN
        value: "libnccl-tuner.so"
      - name: NCCL_TUNER_CONFIG_PATH
        value: "/usr/local/nvidia/lib64/a3plus_tuner_config.textproto"
      - name: LD_LIBRARY_PATH
        value: "/usr/local/nvidia/lib64:/usr/lib/x86_64-linux-gnu"
      - name: NCCL_PROTO
        value: "Simple"
      - name: NCCL_P2P_NVL_CHUNKSIZE
        value: "1048576"
      - name: NCCL_ALGO
        value: "Ring,Tree"
      - name: NCCL_MIN_NCHANNELS
        value: "4"
      - name: NCCL_DYNAMIC_CHUNK_SIZE
        value: "524288"
      - name: NCCL_P2P_NET_CHUNKSIZE
        value: "524288"
      - name: NCCL_P2P_PCI_CHUNKSIZE
        value: "524288"
    extraHostPathMounts: []
    extraVolumeMounts:
      - name: nvtcpxo-libraries
        mountPath: /usr/local/nvidia
        readOnly: true
      - name: nvtcpxo-aperture-devices
        mountPath: /dev/aperture_devices

gpuResourceNames:
  - "nvidia.com/gpu"

# Network resource names to copy to init containers (RDMA, InfiniBand, etc.)
networkResourceNames:
  - "nvidia.com/mlnxnics"
  - "vpc.amazonaws.com/efa"
  # GCP multi-network resources (TCPXO)
  - "networking.gke.io.networks/gpu-nic0"
  - "networking.gke.io.networks/gpu-nic0.IP"
  - "networking.gke.io.networks/gpu-nic1"
  - "networking.gke.io.networks/gpu-nic1.IP"
  - "networking.gke.io.networks/gpu-nic2"
  - "networking.gke.io.networks/gpu-nic2.IP"
  - "networking.gke.io.networks/gpu-nic3"
  - "networking.gke.io.networks/gpu-nic3.IP"
  - "networking.gke.io.networks/gpu-nic4"
  - "networking.gke.io.networks/gpu-nic4.IP"
  - "networking.gke.io.networks/gpu-nic5"
  - "networking.gke.io.networks/gpu-nic5.IP"
  - "networking.gke.io.networks/gpu-nic6"
  - "networking.gke.io.networks/gpu-nic6.IP"
  - "networking.gke.io.networks/gpu-nic7"
  - "networking.gke.io.networks/gpu-nic7.IP"

# Gang discovery configuration for multi-node preflight checks.
# Default (empty): K8s 1.35+ native WorkloadRef API
# For PodGroup-based schedulers, set name and other fields:
gangDiscovery: {}
  # name: "volcano"
  # annotationKeys: ["scheduling.k8s.io/group-name"]
  # labelKeys: []  # optional fallback
  # podGroupGVR:
  #   group: "scheduling.volcano.sh"
  #   version: "v1beta1"
  #   resource: "podgroups"
  # minCountExpr: "podGroup.spec.minMember"  # CEL expression

# Gang coordination configuration for multi-node checks (e.g., nccl-allreduce)
gangCoordination:
  # Enable gang coordination (required for gang-wide checks)
  enabled: true
  # Maximum time to wait for all gang members to register
  timeout: "10m"
  # Port for PyTorch distributed TCP bootstrap (torchrun)
  masterPort: 29500
  # Path where gang ConfigMap is mounted in init containers
  configMapMountPath: "/etc/preflight"
  # NCCL topology ConfigMap name — required for Azure InfiniBand.
  # Without this, NCCL cannot map GPUs to IB HCAs and falls back to TCP.
  # Set explicitly to use a pre-existing ConfigMap, or use ncclTopoShape
  # to auto-create one from the chart's bundled topology files.
  ncclTopoConfigMap: ""
  # VM shape for auto-creating the NCCL topology ConfigMap (IB only).
  # Supported: "ndv4", "ndv5" (files shipped in charts/preflight/files/).
  # When set, a ConfigMap is created from files/<shape>-topo.xml and
  # ncclTopoConfigMap is auto-resolved to its name.
  ncclTopoShape: ""

  # Optional hostPath mounts injected into gang-aware preflight init containers.
  # Fabric-specific; set via overlay files (e.g. values-mnnvl-efa.yaml).
  extraHostPathMounts: []

  # Mount pre-existing pod volumes into preflight init containers.
  # Does NOT create new volumes — only adds volumeMounts for volumes already
  # present in the pod (e.g. injected by a platform webhook).
  # Fabric-specific; set via overlay files (e.g. values-tcpxo.yaml).
  extraVolumeMounts: []

  # Automatically mirror pod-level DRA resource claims (spec.resourceClaims)
  # to preflight init containers' resources.claims. This ensures init
  # containers get the same device access as main containers: GPUs, RDMA
  # NICs, IMEX channels (GB200 MNNVL), etc. See ADR-026 §DRA Integration.
  # Defaults to true when omitted.
  # mirrorResourceClaims: true

# Label-based namespace selection
# Enable preflight in a namespace: kubectl label namespace <name> nvsentinel.nvidia.com/preflight=enabled
namespaceSelector:
  matchLabels:
    nvsentinel.nvidia.com/preflight: "enabled"

networkPolicy:
  enabled: true
