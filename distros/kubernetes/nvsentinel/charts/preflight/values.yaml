replicaCount: 1

image:
  repository: ghcr.io/nvidia/nvsentinel/preflight
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 443
  targetPort: 8443

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

livenessProbe:
  httpGet:
    scheme: HTTPS
    path: /healthz
    port: 8443
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    scheme: HTTPS
    path: /healthz
    port: 8443
  initialDelaySeconds: 2
  periodSeconds: 5

nodeSelector: {}
tolerations: []
affinity: {}

webhook:
  port: 8443
  failurePolicy: Fail
  timeoutSeconds: 10
  certIssuer: "selfsigned-ca-issuer"
  createIssuer: false

# Init containers to inject into GPU pods
# Each entry becomes an init container prepended to the pod
initContainers:
  - name: preflight-ping
    image: ghcr.io/nvidia/nvsentinel/preflight-checks-ping:latest
    # Resources are copied from the target pod's GPU container

# GPU resource names that trigger preflight injection
gpuResourceNames:
  - "nvidia.com/gpu"

# Label-based namespace selection
# Enable preflight in a namespace: kubectl label namespace <name> nvsentinel.nvidia.com/preflight=enabled
namespaceSelector:
  matchLabels:
    nvsentinel.nvidia.com/preflight: "enabled"

networkPolicy:
  enabled: true
