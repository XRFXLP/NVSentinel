{{- if .Values.gangCoordination.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "preflight.fullname" . }}
  labels:
    {{- include "preflight.labels" . | nindent 4 }}
rules:
  # Core resources for gang discovery
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  # ConfigMaps for gang coordination
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Gang discovery API - dynamically generated based on the cluster-wide
  # gangDiscovery config plus any per-namespace gangDiscoveryOverrides.
  {{- /* Collect every gangDiscovery config: the default plus each override. */}}
  {{- $discoveryConfigs := list .Values.gangDiscovery }}
  {{- range .Values.gangDiscoveryOverrides }}
  {{- $discoveryConfigs = append $discoveryConfigs .gangDiscovery }}
  {{- end }}
  {{- /* Deduplicate PodGroup GVRs and track whether native APIs are needed. */}}
  {{- $nativeNeeded := false }}
  {{- $gvrs := dict }}
  {{- range $discoveryConfigs }}
  {{- if .podGroupGVR }}
  {{- $key := printf "%s/%s" .podGroupGVR.group .podGroupGVR.resource }}
  {{- $_ := set $gvrs $key (dict "group" .podGroupGVR.group "resource" .podGroupGVR.resource "name" (.name | default "custom")) }}
  {{- else }}
  {{- $nativeNeeded = true }}
  {{- end }}
  {{- end }}
  {{- range $gvrs }}
  # PodGroup-based scheduler ({{ .name }})
  - apiGroups: [{{ .group | quote }}]
    resources: [{{ .resource | quote }}]
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- if $nativeNeeded }}
  # K8s 1.36+ PodGroup API for native gang scheduling (default)
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["podgroups"]
    verbs: ["get", "list", "watch"]

  # K8s 1.35 Workload API for native gang scheduling fallback (default)
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["workloads"]
    verbs: ["get", "list", "watch"]
  {{- end }}

{{- end }}
