# TLS Certificate for webhook, managed by cert-manager
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "preflight.fullname" . }}-webhook-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "preflight.labels" . | nindent 4 }}
spec:
  secretName: {{ include "preflight.certSecretName" . }}
  duration: 8760h    # 1 year
  renewBefore: 360h  # 15 days before expiration
  commonName: {{ include "preflight.fullname" . }}.{{ .Release.Namespace }}.svc
  dnsNames:
    {{- include "preflight.certDnsNames" . | nindent 4 }}
  issuerRef:
    name: {{ .Values.webhook.certIssuer }}
    kind: Issuer

