apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "preflight.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "preflight.labels" . | nindent 4 }}
data:
  config.yaml: |
    gpuResourceNames:
      {{- toYaml .Values.gpuResourceNames | nindent 6 }}
    networkResourceNames:
      {{- toYaml .Values.networkResourceNames | nindent 6 }}
    dcgm:
      hostengineAddr: {{ include "preflight.dcgmHostengineAddr" . | quote }}
      diagLevel: {{ include "preflight.dcgmDiagLevel" . }}
      connectorSocket: {{ include "preflight.connectorSocket" . | quote }}
      processingStrategy: {{ include "preflight.processingStrategy" . | quote }}
    gangDiscovery:
      {{- toYaml .Values.gangDiscovery | nindent 6 }}
    gangCoordination:
      enabled: {{ .Values.gangCoordination.enabled }}
      timeout: {{ .Values.gangCoordination.timeout | quote }}
      masterPort: {{ .Values.gangCoordination.masterPort }}
      configMapMountPath: {{ .Values.gangCoordination.configMapMountPath | quote }}
      {{- /* Resolve ncclTopoConfigMap: explicit value or fabric default */}}
      {{- $topoConfigMap := .Values.gangCoordination.ncclTopoConfigMap | default (include "preflight.fabric.ncclTopoConfigMap" .) }}
      {{- if $topoConfigMap }}
      ncclTopoConfigMap: {{ $topoConfigMap | quote }}
      {{- end }}
      {{- /* Merge explicit extraHostPathMounts with fabric defaults */}}
      {{- $fabricHPM := include "preflight.fabric.extraHostPathMounts" . | fromYamlArray | default list }}
      {{- $explicitHPM := .Values.gangCoordination.extraHostPathMounts | default list }}
      {{- $allHPM := concat $fabricHPM $explicitHPM }}
      {{- if $allHPM }}
      extraHostPathMounts:
      {{- toYaml $allHPM | nindent 8 }}
      {{- end }}
      {{- /* Merge explicit extraVolumeMounts with fabric defaults */}}
      {{- $fabricVM := include "preflight.fabric.extraVolumeMounts" . | fromYamlArray | default list }}
      {{- $explicitVM := .Values.gangCoordination.extraVolumeMounts | default list }}
      {{- $allVM := concat $fabricVM $explicitVM }}
      {{- if $allVM }}
      extraVolumeMounts:
      {{- toYaml $allVM | nindent 8 }}
      {{- end }}
      {{- if not (kindIs "invalid" .Values.gangCoordination.mirrorResourceClaims) }}
      mirrorResourceClaims: {{ .Values.gangCoordination.mirrorResourceClaims }}
      {{- end }}
    initContainers:
      {{- /* Build fabric env vars + explicit extra env vars */}}
      {{- $fabricEnv := include "preflight.fabric.env" . | fromYamlArray | default list }}
      {{- $extraEnv := .Values.ncclAllreduceExtraEnv | default list }}
      {{- $allExtraEnv := concat $fabricEnv $extraEnv }}
      {{- $result := list }}
      {{- range .Values.initContainers }}
      {{- if and (eq .name "preflight-nccl-allreduce") $allExtraEnv }}
      {{- $container := deepCopy . }}
      {{- $_ := set $container "env" (concat (.env | default list) $allExtraEnv) }}
      {{- $result = append $result $container }}
      {{- else }}
      {{- $result = append $result . }}
      {{- end }}
      {{- end }}
      {{- toYaml $result | nindent 6 }}
