# Fabric overlay: MNNVL + EFA (GB200, GB300 — cross-node NVLink via NVSwitch)
# Usage: helm upgrade preflight . -f values.yaml -f values-mnnvl-efa.yaml
# Requirements:
#   - IPC_LOCK capability (set in base values.yaml)
#   - vpc.amazonaws.com/efa in networkResourceNames (set in base values.yaml)
#   - ComputeDomain CR created in the workload namespace
#   - DRA ResourceClaim for compute-domain-channel in the pod spec
#   - Volcano scheduler with DRA enabled:
#       --feature-gates=DynamicResourceAllocation=true
#       predicate.DynamicResourceAllocationEnable: true
#   - Nodes labelled with resource.nvidia.com/computeDomain=<uid>
#     (typically managed by the compute domain controller/operator)

initContainers:
  - name: preflight-nccl-allreduce
    image: ghcr.io/nvidia/nvsentinel/preflight-nccl-allreduce:latest
    securityContext:
      capabilities:
        add: ["IPC_LOCK"]
    env:
      - name: BW_THRESHOLD_GBPS
        value: "400"
      - name: MESSAGE_SIZES
        value: "4G"
      - name: GANG_TIMEOUT_SECONDS
        value: "600"
      - name: NCCL_DEBUG
        value: "INFO"
      - name: NCCL_DEBUG_SUBSYS
        value: "INIT,NET"
      # MNNVL + EFA specific
      - name: FI_EFA_USE_DEVICE_RDMA
        value: "1"
      - name: NCCL_MNNVL_ENABLE
        value: "1"
      - name: NCCL_NVLS_ENABLE
        value: "0"
      - name: NCCL_NET_GDR_LEVEL
        value: "PHB"
      - name: NCCL_P2P_NET_CHUNKSIZE
        value: "2097152"
      - name: LD_LIBRARY_PATH
        value: "/opt/amazon-efa-ofi/ofi/lib:/opt/amazon-efa-ofi/efa/lib:/usr/local/nvidia/lib64:/usr/lib:/usr/lib64:/usr/local/cuda/lib64"
    volumeMounts:
      - name: nvsentinel-socket
        mountPath: /var/run

gangCoordination:
  # Mount custom EFA/OFI libraries from host (GB200/GB300 use /opt/amazon-efa-ofi)
  extraHostPathMounts:
    - name: amazon-efa
      hostPath: /opt/amazon-efa-ofi
      mountPath: /opt/amazon-efa-ofi
      readOnly: true
      hostPathType: Directory

