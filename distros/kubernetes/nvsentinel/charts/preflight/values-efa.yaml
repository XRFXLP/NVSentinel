# Fabric overlay: AWS EFA (H100 p5 instances, no MNNVL)
# Usage: helm upgrade preflight . -f values.yaml -f values-efa.yaml
# Requirements:
#   - IPC_LOCK capability (set in base values.yaml)
#   - vpc.amazonaws.com/efa in networkResourceNames (set in base values.yaml)
#   - EFA device plugin installed on nodes

ncclAllreduceExtraEnv:
  - name: BW_THRESHOLD_GBPS
    value: "200"
  # EFA-specific NCCL configuration
  - name: FI_EFA_USE_DEVICE_RDMA
    value: "1"
  - name: FI_PROVIDER
    value: "efa"
  - name: NCCL_SOCKET_IFNAME
    value: "eth0"
  - name: LD_LIBRARY_PATH
    value: "/opt/amazon/ofi-nccl/lib:/opt/amazon/efa/lib:/usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64"

gangCoordination:
  extraHostPathMounts:
    - name: host-opt-amazon
      hostPath: /opt/amazon
      mountPath: /opt/amazon
      readOnly: true
      hostPathType: Directory
