replicaCount: 1

image:
  repository: ghcr.io/nvidia/nvsentinel/event-exporter
  pullPolicy: IfNotPresent
  tag: ""

podAnnotations: {}

resources:
  limits:
    cpu: "1"
    memory: "1Gi"
  requests:
    cpu: "500m"
    memory: "512Mi"

# OIDC secret configuration
# The secret should contain a key named 'oidc-client-secret'
# You must create this secret manually before deploying this chart
oidcSecretName: "event-exporter-oidc-secret"

config: |
  [exporter.metadata]
  cluster = "my-cluster"
  environment = "production"
  # Add any custom metadata fields here - they will be included in CloudEvents data.metadata
  # region = "us-west-2"
  # datacenter = "dc01"
  # tenant = "acme-corp"

  [exporter.sink]
  endpoint = "https://events.example.com/api/v1/events"
  timeout = "30s"
  insecure_skip_verify = false

  [exporter.oidc]
  token_url = "https://auth.example.com/oauth2/token"
  client_id = "nvsentinel-exporter"
  scope = "events:write"
  insecure_skip_verify = false

  [exporter.backfill]
  enabled = true
  max_age = "720h"      # 30 days
  max_events = 1000000
  batch_size = 500
  rate_limit = 1000     # events per second

  [exporter.resume_token]
  database = "nvsentinel"
  collection = "resumetokens"

  [exporter.failure_handling]
  max_retries = 17         # ~30 minutes of retries
  initial_backoff = "1s"
  max_backoff = "5m"
  backoff_multiplier = 2.0

