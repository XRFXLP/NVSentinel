suite: HealthEvents indexes
templates:
  - templates/jobs.yaml
tests:
  - it: creates the HealthEvents query indexes for Bitnami MongoDB
    set:
      useBitnami: true
      usePerconaOperator: false
      global.imagePullSecrets: []
    documentSelector:
      path: metadata.name
      value: create-mongodb-database
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "name: 'healtheventstatus_nodequarantined_active'"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "(?s)healtheventstatus_nodequarantined_active.*Quarantined.*AlreadyQuarantined"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "name: 'healtheventstatus_eviction_in_progress'"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "(?s)healtheventstatus_eviction_in_progress.*partialFilterExpression.*InProgress"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "name: 'healtheventstatus_remediation_ready'"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "(?s)healtheventstatus_remediation_ready.*Succeeded.*AlreadyDrained.*faultremediated.*null"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "name: 'healtheventstatus_quarantine_eviction_sparse'"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "(?s)healtheventstatus_quarantine_eviction_sparse.*sparse: true"

  - it: creates the HealthEvents query indexes for Percona MongoDB
    set:
      useBitnami: false
      usePerconaOperator: true
      global.imagePullSecrets: []
    documentSelector:
      path: metadata.name
      value: create-mongodb-database
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "name: 'healtheventstatus_nodequarantined_active'"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "(?s)healtheventstatus_nodequarantined_active.*Quarantined.*AlreadyQuarantined"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "name: 'healtheventstatus_eviction_in_progress'"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "(?s)healtheventstatus_eviction_in_progress.*partialFilterExpression.*InProgress"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "name: 'healtheventstatus_remediation_ready'"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "(?s)healtheventstatus_remediation_ready.*Succeeded.*AlreadyDrained.*faultremediated.*null"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "name: 'healtheventstatus_quarantine_eviction_sparse'"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "(?s)healtheventstatus_quarantine_eviction_sparse.*sparse: true"
