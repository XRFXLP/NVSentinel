# Custom drain demo configuration for node-drainer
replicaCount: 1

logLevel: info

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Disable user namespaces (using custom drain instead)
userNamespaces: []

# Enable custom drain for slinky-drainer integration
customDrain:
  enabled: true
  
  # Template configuration
  templateConfigMapName: "slinky-drain-template"
  templateMountPath: "/etc/drain-template"
  templateFileName: "drain-template.yaml"
  
  # Custom drain CR configuration
  namespace: "nvsentinel"
  apiGroup: "nvsentinel.nvidia.com"
  version: "v1alpha1"
  kind: "DrainRequest"
  resource: "drainrequests"
  
  # Status checking configuration
  statusConditionType: "Complete"
  statusConditionStatus: "True"
  timeout: "30m"

# Global configuration
global:
  datastore:
    provider: mongodb
    mongodb:
      uri: "mongodb://mongodb.nvsentinel.svc.cluster.local:27017"
      database: "nvsentinel"
      collection: "healthevents"
      tokenDatabase: "nvsentinel"
      tokenCollection: "resumetokens"
  
  dryRun: false

