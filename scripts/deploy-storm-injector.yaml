---
# storm-injector DaemonSet — targets KWOK nodes (nvsentinel-scale-test=true, type=kwok)
# These pods are simulated by KWOK as "Running"; they do not execute real code.
# For actual pipeline testing use the storm-injector-real Deployment below.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: storm-injector
  namespace: nvsentinel
  labels:
    app: storm-injector
    component: scale-test
spec:
  selector:
    matchLabels:
      app: storm-injector
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 50
  template:
    metadata:
      labels:
        app: storm-injector
        component: scale-test
    spec:
      # Tolerate the KWOK node taint so pods schedule on KWOK virtual nodes
      tolerations:
        - key: kwok.x-k8s.io/node
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        nvsentinel-scale-test: "true"
        type: kwok
      terminationGracePeriodSeconds: 10
      containers:
        - name: storm-injector
          image: xrfxlp/storm-injector:latest
          imagePullPolicy: Always
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Confirmed by debug pod: host path /var/run/nvsentinel/nodeHealthEvents.sock
            # maps to /var/run/nodeHealthEvents.sock inside container (hostPath mount)
            - name: SOCKET_PATH
              value: /var/run/nodeHealthEvents.sock
            - name: STORM_MULTIPLIER
              value: "1"
            - name: PROCESSING_STRATEGY
              value: STORE_AND_ANALYSE
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: var-run-nvsentinel
              mountPath: /var/run
      volumes:
        - name: var-run-nvsentinel
          hostPath:
            path: /var/run/nvsentinel
            type: DirectoryOrCreate
---
# storm-injector-real Deployment — runs on CPU nodes where platform-connector
# actually has a live socket.  Use this for real event injection + log/MongoDB
# verification.  Scale replicas for multiplier testing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storm-injector-real
  namespace: nvsentinel
  labels:
    app: storm-injector-real
    component: scale-test
spec:
  replicas: 3
  selector:
    matchLabels:
      app: storm-injector-real
  template:
    metadata:
      labels:
        app: storm-injector-real
        component: scale-test
    spec:
      # Run on the 3 CPU nodes (non-GPU, non-KWOK, non-system)
      nodeSelector:
        kubernetes.io/os: linux
        node.kubernetes.io/instance-type: Standard_D8ds_v5
      tolerations:
        - key: "CriticalAddonsOnly"
          operator: Exists
        - operator: Exists
      # Ensure one pod per real CPU node
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: storm-injector-real
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: type
                    operator: NotIn
                    values: ["kwok"]
                  - key: nvidia.com/gpu.present
                    operator: DoesNotExist
      terminationGracePeriodSeconds: 10
      containers:
        - name: storm-injector
          image: xrfxlp/storm-injector:latest
          imagePullPolicy: Always
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SOCKET_PATH
              value: /var/run/nvsentinel.sock
            - name: STORM_MULTIPLIER
              value: "1"
            - name: PROCESSING_STRATEGY
              value: STORE_AND_ANALYSE
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: var-run-nvsentinel
              mountPath: /var/run
      volumes:
        - name: var-run-nvsentinel
          hostPath:
            path: /var/run/nvsentinel
            type: DirectoryOrCreate
