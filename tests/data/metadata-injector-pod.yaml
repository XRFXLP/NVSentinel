# Debug pod for injecting GPU metadata to node's host filesystem
# This mimics what metadata-collector does but for testing purposes
apiVersion: v1
kind: Pod
metadata:
  name: metadata-injector
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: writer
      image: busybox:latest
      command: ["sh", "-c", "sleep 60"]
      volumeMounts:
        - name: metadata-vol
          mountPath: /var/lib/nvsentinel
  volumes:
    - name: metadata-vol
      hostPath:
        path: /var/lib/nvsentinel
        type: DirectoryOrCreate

