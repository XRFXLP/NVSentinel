apiVersion: v1
kind: Pod
metadata:
  name: fq-event-injector
  namespace: nvsentinel
  labels:
    app: fq-event-injector
spec:
  restartPolicy: Never
  tolerations:
  - key: dedicated
    value: system-workload
    effect: NoSchedule
    operator: Equal
  - key: dedicated
    value: system-workload
    effect: NoExecute
    operator: Equal
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: type
            operator: NotIn
            values: [kwok]
  containers:
  - name: injector
    image: busybox
    command: ["sh", "-c", "sleep infinity"]
    volumeMounts:
    - name: nvsentinel-socket
      mountPath: /var/run
    resources:
      requests:
        cpu: 500m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 512Mi
  volumes:
  - name: nvsentinel-socket
    hostPath:
      path: /var/run/nvsentinel
      type: Directory
