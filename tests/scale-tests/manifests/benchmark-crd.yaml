apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: benchmarkobjects.benchmark.nvsentinel.io
spec:
  group: benchmark.nvsentinel.io
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            x-kubernetes-preserve-unknown-fields: true
            properties:
              healthy:
                type: boolean
              payload:
                type: string
              labels:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              annotations:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              conditions:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
  scope: Namespaced
  names:
    plural: benchmarkobjects
    singular: benchmarkobject
    kind: BenchmarkObject
    shortNames:
    - bobj
