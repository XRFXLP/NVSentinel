# Long-lived in-cluster shell used to run the scale generators (k8s-object-scaler,
# health-event-filler) from inside the cluster. Running them in-cluster removes the
# client-side network path, which would otherwise be the ceiling rather than the
# API server. Sleep is long on purpose: an expiring pod silently invalidates a run.
apiVersion: v1
kind: Pod
metadata:
  name: e2e-runner
  namespace: nvsentinel
spec:
  serviceAccountName: e2e-bench
  restartPolicy: Never
  containers:
    - name: runner
      image: busybox:1.36
      command: ['sleep', '604800']
      resources:
        requests: {cpu: 200m, memory: 512Mi}
        limits: {cpu: '2', memory: 4Gi}
  tolerations:
    - {key: dedicated, operator: Equal, value: system-workload, effect: NoSchedule}
    - {key: dedicated, operator: Equal, value: system-workload, effect: NoExecute}
