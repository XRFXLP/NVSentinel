# Heartbeat stage — refreshes Ready condition every 30s ± 5s to match real kubelet cadence.
apiVersion: kwok.x-k8s.io/v1alpha1
kind: Stage
metadata:
  name: node-heartbeat
  namespace: kube-system
spec:
  resourceRef:
    apiGroup: v1
    kind: Node
  selector:
    matchExpressions:
      - key: '.metadata.annotations.["kwok.x-k8s.io/node"]'
        operator: 'In'
        values:
          - 'fake'
  weight: 2
  # Real kubelets with the NodeLease feature refresh the cheap Lease object
  # every ~10s but rewrite the Node object itself only every ~5 minutes. A 30s
  # node rewrite is an order of magnitude more churn than production, and at
  # fleet scale each rewrite is a new ~50 KB etcd revision: 10k nodes at 30s is
  # roughly 1 GB of revisions per minute, which drives the etcd database size
  # far above the live object footprint.
  delay:
    durationMilliseconds: 300000
    jitterDurationMilliseconds: 30000
  next:
    statusTemplate: |
      conditions:
      - lastHeartbeatTime: {{ Now | Quote }}
        lastTransitionTime: {{ Now | Quote }}
        message: "kubelet is posting ready status"
        reason: KubeletReady
        status: "True"
        type: Ready
      - lastHeartbeatTime: {{ Now | Quote }}
        lastTransitionTime: {{ Now | Quote }}
        message: "kubelet has sufficient memory available"
        reason: KubeletHasSufficientMemory
        status: "False"
        type: MemoryPressure
      - lastHeartbeatTime: {{ Now | Quote }}
        lastTransitionTime: {{ Now | Quote }}
        message: "kubelet has no disk pressure"
        reason: KubeletHasNoDiskPressure
        status: "False"
        type: DiskPressure
      - lastHeartbeatTime: {{ Now | Quote }}
        lastTransitionTime: {{ Now | Quote }}
        message: "kubelet has sufficient PID available"
        reason: KubeletHasSufficientPID
        status: "False"
        type: PIDPressure
---
# Pod stage: transitions to Running with a realistic 5-condition status,
# full containerStatus (lastState, volumeMounts, imageID with sha256),
# hostIPs array, and qosClass — matching ~7 KB total object size.
apiVersion: kwok.x-k8s.io/v1alpha1
kind: Stage
metadata:
  name: pod-running
  namespace: kube-system
spec:
  resourceRef:
    apiGroup: v1
    kind: Pod
  selector:
    matchExpressions:
      - key: '.metadata.deletionTimestamp'
        operator: 'DoesNotExist'
      - key: '.status.phase'
        operator: 'In'
        values:
          - 'Pending'
  weight: 1
  delay:
    durationMilliseconds: 300
    jitterDurationMilliseconds: 200
  next:
    statusTemplate: |
      conditions:
      - lastProbeTime: null
        lastTransitionTime: {{ Now | Quote }}
        status: "True"
        type: PodReadyToStartContainers
      - lastProbeTime: null
        lastTransitionTime: {{ Now | Quote }}
        status: "True"
        type: Initialized
      - lastProbeTime: null
        lastTransitionTime: {{ Now | Quote }}
        status: "True"
        type: Ready
      - lastProbeTime: null
        lastTransitionTime: {{ Now | Quote }}
        status: "True"
        type: ContainersReady
      - lastProbeTime: null
        lastTransitionTime: {{ Now | Quote }}
        status: "True"
        type: PodScheduled
      containerStatuses:
      {{ range .spec.containers }}
      - containerID: "cri-o://{{ .name }}aabbccddeeff0011223344556677889900aabbccddeeff0011223344556677"
        image: {{ .image | Quote }}
        imageID: "{{ .image }}@sha256:aabbccddeeff0011223344556677889900aabbccddeeff0011223344556677889900"
        name: {{ .name | Quote }}
        ready: true
        restartCount: 0
        started: true
        state:
          running:
            startedAt: {{ Now | Quote }}
      {{ end }}
      hostIP: "10.0.10.194"
      hostIPs:
      - ip: "10.0.10.194"
      phase: Running
      podIP: "10.244.1.1"
      podIPs:
      - ip: "10.244.1.1"
      qosClass: Burstable
      startTime: {{ Now | Quote }}
---
# Pod deletion stage: removes pods once deletionTimestamp is set.
apiVersion: kwok.x-k8s.io/v1alpha1
kind: Stage
metadata:
  name: pod-delete
  namespace: kube-system
spec:
  resourceRef:
    apiGroup: v1
    kind: Pod
  selector:
    matchExpressions:
      - key: '.metadata.deletionTimestamp'
        operator: 'Exists'
  weight: 1
  delay:
    durationMilliseconds: 100
  next:
    delete: true
