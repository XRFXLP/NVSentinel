# Realistic KWOK stages modelled on actual cluster node and pod objects.
#
# Node: 13 conditions (kubelet + skyhook + network + GPU health monitor),
# 50 images with 3 sha256-tagged names each, real capacity/allocatable
# (32 CPU / 128 GiB), cri-o runtime, runtimeHandlers, volumesAttached —
# matching ~31 KB total object size observed on real cluster nodes.
#
# Pod: 5 conditions (PodReadyToStartContainers included), containerStatus
# with lastState.terminated, volumeMounts, hostIPs — matching ~7 KB total
# object size observed on real cluster pods.
---
apiVersion: kwok.x-k8s.io/v1alpha1
kind: Stage
metadata:
  name: node-initialize
  namespace: kube-system
spec:
  resourceRef:
    apiGroup: v1
    kind: Node
  selector:
    matchExpressions:
      - key: '.metadata.annotations.["kwok.x-k8s.io/node"]'
        operator: 'In'
        values:
          - 'fake'
      # Without this second clause the selector stays true after the stage has
      # run, so KWOK re-applies node-initialize forever -- throttled only by
      # nodePlayStageParallelism. At 10k nodes that is ~244 node status writes
      # per second, each a new ~53 KB etcd revision, which is what drives the
      # etcd database size far above the live object footprint. Matching on an
      # unset allocatable makes the stage fire exactly once per node.
      - key: '.status.allocatable.cpu'
        operator: 'DoesNotExist'
  weight: 1
  delay:
    durationMilliseconds: 500
  next:
    statusTemplate: |
      conditions:
      - lastHeartbeatTime: {{ Now | Quote }}
        lastTransitionTime: {{ Now | Quote }}
        message: "kubelet is posting ready status"
        reason: KubeletReady
        status: "True"
        type: Ready
      - lastHeartbeatTime: {{ Now | Quote }}
        lastTransitionTime: {{ Now | Quote }}
        message: "kubelet has sufficient memory available"
        reason: KubeletHasSufficientMemory
        status: "False"
        type: MemoryPressure
      - lastHeartbeatTime: {{ Now | Quote }}
        lastTransitionTime: {{ Now | Quote }}
        message: "kubelet has no disk pressure"
        reason: KubeletHasNoDiskPressure
        status: "False"
        type: DiskPressure
      - lastHeartbeatTime: {{ Now | Quote }}
        lastTransitionTime: {{ Now | Quote }}
        message: "kubelet has sufficient PID available"
        reason: KubeletHasSufficientPID
        status: "False"
        type: PIDPressure
      - lastHeartbeatTime: {{ Now | Quote }}
        lastTransitionTime: {{ Now | Quote }}
        message: "Flannel is running on this node"
        reason: FlannelIsUp
        status: "False"
        type: NetworkUnavailable
      - lastHeartbeatTime: {{ Now | Quote }}
        lastTransitionTime: {{ Now | Quote }}
        message: "Skyhook disable-module Ready"
        reason: Complete
        status: "False"
        type: "skyhook.nvidia.com/disable-module/NotReady"
      - lastHeartbeatTime: {{ Now | Quote }}
        lastTransitionTime: {{ Now | Quote }}
        message: "Package Erroring or Unknown for disable-module"
        reason: Not Erroring
        status: "False"
        type: "skyhook.nvidia.com/disable-module/Erroring"
      - lastHeartbeatTime: {{ Now | Quote }}
        lastTransitionTime: {{ Now | Quote }}
        message: "Skyhook cluster-wide Ready"
        reason: Complete
        status: "False"
        type: "skyhook.nvidia.com/cluster-wide/NotReady"
      - lastHeartbeatTime: {{ Now | Quote }}
        lastTransitionTime: {{ Now | Quote }}
        message: "Package Erroring or Unknown for cluster-wide"
        reason: Not Erroring
        status: "False"
        type: "skyhook.nvidia.com/cluster-wide/Erroring"
      - lastHeartbeatTime: {{ Now | Quote }}
        lastTransitionTime: {{ Now | Quote }}
        message: "No Health Failures"
        reason: InfiniBandErrorCheckIsHealthy
        status: "False"
        type: InfiniBandErrorCheck
      - lastHeartbeatTime: {{ Now | Quote }}
