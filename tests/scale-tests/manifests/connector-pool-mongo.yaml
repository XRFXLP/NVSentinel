# Generated by gen-connector-pool-mongo.py --per-pod 10 --rate 0.1
# Connectors = 10 x replicas. Runs in the nvsentinel namespace to reuse
# the existing mongo-app-client-cert-secret and MongoDB service DNS.
#
# Scale deliberately and watch MongoDB connections between steps:
#   kubectl -n nvsentinel scale statefulset connector-pool-mongo --replicas=10
apiVersion: v1
kind: ConfigMap
metadata:
  name: connector-pool-mongo-config
  namespace: nvsentinel
data:
  config.json: |
    {
      "enableK8sPlatformConnector": "false",
      "K8sConnectorQps": 5.0,
      "K8sConnectorBurst": 10,
      "MaxNodeConditionMessageLength": 1024,
      "CompactedHealthEventMsgLen": 72,
      "StoreConnectorMaxRetries": 3,
      "enableMongoDBStorePlatformConnector": "true",
      "enablePostgresDBStorePlatformConnector": "false",
      "enableNodeBindingAuth": "false",
      "AuthAudience": "platform-connector.nvsentinel.nvidia.com",
      "AuthCrossNodeServiceAccounts": [
        "system:serviceaccount:nvsentinel:health-events-analyzer"
      ],
      "AuthMode": "permissive",
      "AuthFailOpenOnUnavailable": "false",
      "enableGRPCSinkConnector": "false",
      "GRPCSinkTarget": "",
      "GRPCSinkConnectorMaxRetries": 3,
      "GRPCSinkTokenPath": "",
      "pipeline": []
    }
  metadata.toml: |
    cacheSize = 50
    cacheTTL = "3600s"
    allowedLabels = []
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: connector-pool-mongo
  namespace: nvsentinel
spec:
  serviceName: connector-pool-mongo
  podManagementPolicy: Parallel
  replicas: 1
  selector:
    matchLabels: {app: connector-pool-mongo}
  template:
    metadata:
      labels: {app: connector-pool-mongo}
    spec:
      tolerations:
      - {key: dedicated, operator: Equal, value: system-workload, effect: NoSchedule}
      - {key: dedicated, operator: Equal, value: system-workload, effect: NoExecute}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: "kwok.x-k8s.io/node", operator: DoesNotExist}
      containers:
      - name: connector-0
        image: ghcr.io/nvidia/nvsentinel/platform-connectors:v1.20.0
        args:
        - --socket=/var/run/connector/c0.sock
        - --config=/etc/config/config.json
        - --metrics-port=2112
        - --mongo-client-cert-mount-path=/etc/ssl/mongo-client
        env:
        - name: MONGODB_CLIENT_CERT_MOUNT_PATH
          value: /etc/ssl/mongo-client
        - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
        - name: NODE_NAME
          value: "pool-0"
        resources:
          requests: {cpu: 10m, memory: 24Mi}
          limits: {cpu: 200m, memory: 128Mi}
        volumeMounts:
        - {name: socket-dir, mountPath: /var/run/connector}
        - {name: config, mountPath: /etc/config}
        - {name: mongo-cert, mountPath: /etc/ssl/mongo-client}
      - name: connector-1
        image: ghcr.io/nvidia/nvsentinel/platform-connectors:v1.20.0
        args:
